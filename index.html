<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>א.ש ניהול פיננסי</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAzMiAzMiI+PHJlY3Qgd2lkdGg9IjMyIiBoZWlnaHQ9IjMyIiByeD0iNyIgZmlsbD0iIzRmNDZlNSIvPjx0ZXh0IHg9IjE2IiB5PSIyMiIgZm9udC1mYW1pbHk9IkhlZWJvLCBBcmlhbCwgc2Fucy1zZXJpZiIgZm9udC1zaXplPSIxNiIgZm9udC13ZWlnaHQ9IjgwMCIgZmlsbD0iI2ZmZmZmZiIgdGV4dC1hbmNob3I9Im1pZGRsZSI+15DXqTwvdGV4dD48Y2lyY2xlIGN4PSIyNSIgY3k9IjgiIHI9IjQiIGZpbGw9IiNmNTllMGIiLz48L3N2Zz4K" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    #fabNew { position: fixed; top: 62px; left: 16px; z-index: 40; display: none; flex-direction: column; align-items: flex-start; gap: 8px; }
    #fabNew .fab-btn { width: 52px; height: 52px; border-radius: 50%; border: none; background: #4f46e5; color: #fff; font-size: 30px; line-height: 1; cursor: pointer; box-shadow: 0 4px 16px rgba(79,70,229,.45); transition: transform .12s, background .12s; }
    #fabNew .fab-btn:hover { background: #4338ca; transform: scale(1.06); }
    #fabMenu { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; box-shadow: 0 10px 28px rgba(0,0,0,.16); padding: 6px; min-width: 200px; }
    #fabMenu.hidden { display: none; }
    #fabMenu .fab-opt { display: block; width: 100%; text-align: right; background: none; border: none; padding: 9px 12px; font-size: 14px; cursor: pointer; border-radius: 8px; color: #1f2937; font-family: inherit; }
    #fabMenu .fab-opt:hover { background: #eef0fb; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">🎛️ מערכת ניהול - א.ש ניהול פיננסי</div>
    <div class="company-switch">
      <label>חברה:</label>
      <select id="companySelect"></select>
    </div>
    <div id="statusPills" class="pills"></div>
  </header>

  <nav class="tabs">
    <button class="tab active" data-tab="home">🏠 בית</button>
    <button class="tab" data-tab="summary">📊 סיכום עסק</button>
    <button class="tab" data-tab="events">אירועים ויומן</button>
    <button class="tab" data-tab="quotes">📄 הצעות מחיר</button>
    <button class="tab" data-tab="clients">מסמכים ולקוחות</button>
    <button class="tab" data-tab="contractors">ספקים</button>
    <button class="tab" data-tab="payroll">עובדים</button>
    <button class="tab" data-tab="bank">🏦 בנק</button>
    <button class="tab" data-tab="connections">🔌 חיבורים</button>
    <button class="tab" data-tab="business">🏢 פרטי העסק</button>
  </nav>

  <!-- כפתור "+" צף (מסמך חדש מכל מקום) — מוצג רק אחרי התחברות -->
  <div id="fabNew">
    <button class="fab-btn" onclick="toggleFabMenu()" title="מסמך חדש">+</button>
    <div id="fabMenu" class="hidden">
      <button class="fab-opt" onclick="fabNewDoc(10)">📄 הצעת מחיר</button>
      <button class="fab-opt" onclick="fabNewDoc(300)">🧾 חשבונית עסקה</button>
      <button class="fab-opt" onclick="fabNewDoc(305)">🧾 חשבונית מס</button>
      <button class="fab-opt" onclick="fabNewDoc(320)">🧾 חשבונית מס-קבלה</button>
    </div>
  </div>

  <main id="content"></main>

  <!-- מודל הדבקת הודעת ווטסאפ -->
  <div id="ingestModal" class="modal hidden">
    <div class="modal-card">
      <h3>הדבקת הודעת אירוע מווטסאפ</h3>
      <p class="muted">הדבק את ההודעה כפי שהיא (תאריך / זמר / תמחור / מיקום / סאונד / עובדים / תוספת / קבלן). המערכת תנתח אוטומטית.</p>
      <textarea id="ingestText" rows="10" placeholder="תאריך: 20/07/2026&#10;זמר: ...&#10;תמחור: ...&#10;מיקום: ...&#10;סאונד: ...&#10;עובדים: ...&#10;תוספת לעובדים: ...&#10;קבלן: ..."></textarea>
      <div class="modal-actions">
        <button id="ingestCancel" class="btn ghost">ביטול</button>
        <button id="ingestSave" class="btn primary">נתח ושמור</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
